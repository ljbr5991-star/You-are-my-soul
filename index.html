<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخديوي التعليمية | مستر محمد مساعد مستر علي جبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;800&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#160a08;
  --maroon-deep:#4a0e17;
  --maroon:#6d1220;
  --maroon-bright:#8f1a2b;
  --gold:#c9a227;
  --gold-bright:#e9c664;
  --gold-pale:#f3e3b0;
  --papyrus:#f4ecd8;
  --papyrus-dim:#e7dabc;
  --line: rgba(201,162,39,.35);
  --shadow: 0 18px 40px rgba(10,4,3,.45);
  --serif:'Amiri', 'Times New Roman', serif;
  --sans:'Cairo', 'Tahoma', sans-serif;
  --kufi:'Reem Kufi', var(--sans);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(201,162,39,.10), transparent 60%),
    radial-gradient(900px 500px at 105% 10%, rgba(143,26,43,.18), transparent 55%),
    var(--ink);
  color:var(--papyrus);
  font-family:var(--sans);
  line-height:1.7;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;}
h1,h2,h3,h4{font-family:var(--serif);margin:0;color:var(--gold-bright);font-weight:700;}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
.eyebrow{color:var(--gold);}

/* subtle papyrus grain */
body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  opacity:.05;
  background-image:repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 4px);
  z-index:1;
}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, rgba(15,7,6,.96), rgba(15,7,6,.86));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;max-width:1180px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-badge{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--gold);
  overflow:hidden;flex:none;
  box-shadow:0 0 0 4px rgba(201,162,39,.12);
}
.brand-badge img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family:var(--kufi);font-size:1.15rem;color:var(--gold-bright);letter-spacing:.3px;}
.brand-sub{font-size:.72rem;color:var(--papyrus-dim);opacity:.8;}
nav.links{display:flex;gap:28px;font-size:.95rem;}
nav.links a{text-decoration:none;color:var(--papyrus-dim);position:relative;padding:6px 0;}
nav.links a:hover{color:var(--gold-bright);}
.nav-toggle{display:none;background:none;border:1px solid var(--line);color:var(--gold-bright);border-radius:8px;padding:8px 10px;font-size:1.1rem;}
.nav-social{display:flex;gap:10px;}
.social-icon{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--gold-bright);
  transition:transform .15s ease, border-color .15s ease, color .15s ease;
  text-decoration:none;
}
.social-icon:hover{transform:translateY(-2px);border-color:var(--gold);}
.social-icon.wa:hover{color:#3ddc7a;}
.social-icon.fb:hover{color:#5b8def;}
.float-wa{
  position:fixed;bottom:24px;left:24px;z-index:80;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#25d366,#128c4b);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(0,0,0,.45);
  color:#fff;text-decoration:none;
}
.float-wa svg{width:28px;height:28px;fill:#fff;}
@media(max-width:920px){ .nav-social{display:none;} }

/* ===== Hero ===== */
.hero{
  position:relative;
  padding:76px 0 90px;
  border-bottom:1px solid var(--line);
  overflow:hidden;
}
.hero .wrap{
  display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;
  position:relative;z-index:2;
}
.hero-compass{
  position:absolute;left:-90px;top:-90px;width:340px;height:340px;
  opacity:.08;
  background:conic-gradient(from 0deg, var(--gold) 0 2deg, transparent 2deg 90deg, var(--gold) 90deg 92deg, transparent 92deg 180deg, var(--gold) 180deg 182deg, transparent 182deg 270deg, var(--gold) 270deg 272deg, transparent 272deg 360deg);
  border-radius:50%;
}
.motto-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.82rem;color:var(--gold);
  border:1px solid var(--line);
  padding:6px 14px;border-radius:999px;
  margin-bottom:22px;
  font-family:var(--sans);
}
.hero h1{
  font-size:clamp(2.1rem, 4vw, 3.1rem);
  line-height:1.28;
  margin-bottom:18px;
}
.hero h1 span{color:var(--gold);}
.hero p.lede{
  font-size:1.08rem;color:var(--papyrus-dim);max-width:52ch;margin-bottom:30px;
}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;border-radius:10px;
  font-family:var(--sans);font-weight:700;font-size:.98rem;
  text-decoration:none;cursor:pointer;border:none;
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn-gold{
  background:linear-gradient(135deg, var(--gold-bright), var(--gold));
  color:#241004;box-shadow:0 12px 24px rgba(201,162,39,.25);
}
.btn-outline{
  background:transparent;border:1.5px solid var(--line);color:var(--gold-bright);
}
.hero-portrait{
  position:relative;
  aspect-ratio:1/1;border-radius:50%;
  border:3px solid var(--gold);
  box-shadow:var(--shadow), 0 0 0 10px rgba(201,162,39,.06);
  overflow:hidden;
  justify-self:center;
  width:min(360px, 100%);
}
.hero-portrait img{width:100%;height:100%;object-fit:cover;}
.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:38px;
  max-width:520px;
}
.stat{
  border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;
  background:rgba(201,162,39,.04);
}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--gold-bright);}
.stat span{font-size:.76rem;color:var(--papyrus-dim);}

/* ===== Section shell ===== */
section{padding:74px 0;position:relative;z-index:2;}
.section-head{max-width:640px;margin:0 auto 46px;text-align:center;}
.section-head .eyebrow{font-size:.82rem;letter-spacing:.4px;}
.section-head h2{font-size:clamp(1.7rem,3vw,2.3rem);margin-top:10px;}
.section-head p{color:var(--papyrus-dim);margin-top:12px;}
.divider{
  width:70px;height:3px;margin:18px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ===== Grade selection ===== */
.stage-group{margin-bottom:14px;}
.stage-label{
  text-align:center;font-family:var(--kufi);color:var(--gold);
  font-size:1rem;margin:34px 0 22px;
  display:flex;align-items:center;gap:14px;
}
.stage-label::before,.stage-label::after{content:"";flex:1;height:1px;background:var(--line);}
.grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.grade-card{
  background:linear-gradient(160deg, rgba(109,18,32,.35), rgba(20,10,8,.6));
  border:1px solid var(--line);
  border-radius:16px;
  padding:26px 22px;
  cursor:pointer;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  position:relative;
}
.grade-card:hover{
  transform:translateY(-6px);
  border-color:var(--gold);
  box-shadow:0 16px 32px rgba(0,0,0,.35);
}
.grade-card.active{border-color:var(--gold-bright);box-shadow:0 0 0 2px rgba(201,162,39,.3);}
.grade-icon{
  width:46px;height:46px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(201,162,39,.12);border:1px solid var(--line);
  margin-bottom:16px;color:var(--gold-bright);
}
.grade-card h3{font-size:1.15rem;margin-bottom:6px;}
.grade-card p{color:var(--papyrus-dim);font-size:.88rem;margin:0 0 14px;}
.grade-meta{display:flex;gap:8px;font-size:.72rem;color:var(--gold);flex-wrap:wrap;}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;}

/* ===== Quiz panel ===== */
.quiz-panel{
  margin-top:50px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(180deg, rgba(74,14,23,.35), rgba(15,7,6,.7));
  padding:34px;
  display:none;
}
.quiz-panel.show{display:block;animation:reveal .5s ease both;}
@keyframes reveal{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.quiz-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
.quiz-title{font-family:var(--serif);font-size:1.35rem;color:var(--gold-bright);}
.quiz-sub{font-size:.85rem;color:var(--papyrus-dim);}
.diff-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
.diff-toggle button{
  border:none;background:transparent;color:var(--papyrus-dim);
  padding:9px 20px;font-family:var(--sans);font-weight:600;cursor:pointer;font-size:.86rem;
}
.diff-toggle button.active{background:var(--gold);color:#241004;}
.count-select{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--papyrus-dim);}
.count-select select{
  background:var(--maroon-deep);color:var(--papyrus);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-family:var(--sans);
}
.start-row{display:flex;justify-content:center;margin-top:26px;}

/* progress */
.progress-wrap{margin-bottom:24px;}
.progress-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--gold-bright));width:0%;transition:width .35s ease;}
.progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--papyrus-dim);margin-top:8px;}

.question-card{display:none;}
.question-card.show{display:block;animation:reveal .35s ease both;}
.q-badge{display:inline-block;font-size:.72rem;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:14px;}
.q-text{font-size:1.22rem;color:var(--papyrus);margin-bottom:24px;font-family:var(--sans);font-weight:700;line-height:1.65;}
.options{display:grid;gap:12px;}
.option-btn{
  text-align:right;
  padding:15px 18px;border-radius:12px;
  border:1.5px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--papyrus);font-family:var(--sans);font-size:.98rem;
  cursor:pointer;transition:all .15s ease;
  display:flex;align-items:center;gap:12px;
}
.option-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(201,162,39,.06);}
.option-letter{
  width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:none;color:var(--gold);
}
.option-btn.correct{border-color:#4caf6d;background:rgba(76,175,109,.12);}
.option-btn.correct .option-letter{background:#4caf6d;border-color:#4caf6d;color:#0a1a0f;}
.option-btn.wrong{border-color:#c85454;background:rgba(200,84,84,.12);}
.option-btn.wrong .option-letter{background:#c85454;border-color:#c85454;color:#1a0a0a;}
.option-btn:disabled{cursor:default;}
.explain{
  margin-top:18px;padding:14px 16px;border-radius:10px;
  background:rgba(201,162,39,.07);border:1px solid var(--line);
  font-size:.88rem;color:var(--papyrus-dim);display:none;
}
.explain.show{display:block;}
.quiz-nav{display:flex;justify-content:space-between;margin-top:26px;}
.quiz-nav .btn{padding:11px 22px;font-size:.9rem;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--papyrus-dim);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;}

/* results */
.result-card{display:none;text-align:center;padding:20px 0;}
.result-card.show{display:block;animation:reveal .4s ease both;}
.result-score{font-family:var(--serif);font-size:3.4rem;color:var(--gold-bright);margin:10px 0 4px;}
.result-msg{font-size:1.05rem;color:var(--papyrus);margin-bottom:26px;}
.result-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}

/* ===== Random challenge banner ===== */
.challenge-banner{
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(120deg, rgba(143,26,43,.4), rgba(74,14,23,.25));
  padding:32px 34px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
}
.challenge-banner h3{font-size:1.3rem;margin-bottom:8px;}
.challenge-banner p{color:var(--papyrus-dim);margin:0;max-width:44ch;font-size:.92rem;}

/* ===== About teacher ===== */
.about-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:44px;align-items:center;}
.about-photo{
  border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);
}
.about-list{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:14px;}
.about-list li{display:flex;gap:12px;align-items:flex-start;color:var(--papyrus-dim);font-size:.95rem;}
.about-list .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none;}

/* ===== Contact / Footer ===== */
footer{border-top:1px solid var(--line);padding:50px 0 30px;}
.foot-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px;margin-bottom:30px;}
.foot-brand{display:flex;align-items:center;gap:12px;}
.foot-brand .brand-badge{width:44px;height:44px;}
.contact-btn{
  display:inline-flex;align-items:center;gap:10px;color:var(--gold-bright);
  border:1px solid var(--line);border-radius:999px;padding:10px 20px;text-decoration:none;font-size:.9rem;
}
.foot-bottom{border-top:1px solid var(--line);padding-top:20px;text-align:center;font-size:.8rem;color:var(--papyrus-dim);}

/* responsive */
@media(max-width:920px){
  .hero .wrap{grid-template-columns:1fr;text-align:center;}
  .hero-ctas{justify-content:center;}
  .hero-stats{margin-inline:auto;}
  .grade-grid{grid-template-columns:repeat(2,1fr);}
  .about-grid{grid-template-columns:1fr;}
  nav.links{display:none;}
  .nav-toggle{display:inline-block;}
}
@media(max-width:600px){
  .grade-grid{grid-template-columns:1fr;}
  .quiz-top{flex-direction:column;align-items:flex-start;}
  .challenge-banner{flex-direction:column;text-align:center;}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>
</head>

  padding:76px 0 90px;
  border-bottom:1px solid var(--line);
  overflow:hidden;
}
.hero .wrap{
  display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;
  position:relative;z-index:2;
}
.hero-compass{
  position:absolute;left:-90px;top:-90px;width:340px;height:340px;
  opacity:.08;
  background:conic-gradient(from 0deg, var(--gold) 0 2deg, transparent 2deg 90deg, var(--gold) 90deg 92deg, transparent 92deg 180deg, var(--gold) 180deg 182deg, transparent 182deg 270deg, var(--gold) 270deg 272deg, transparent 272deg 360deg);
  border-radius:50%;
}
.motto-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.82rem;color:var(--gold);
  border:1px solid var(--line);
  padding:6px 14px;border-radius:999px;
  margin-bottom:22px;
  font-family:var(--sans);
}
.hero h1{
  font-size:clamp(2.1rem, 4vw, 3.1rem);
  line-height:1.28;
  margin-bottom:18px;
}
.hero h1 span{color:var(--gold);}
.hero p.lede{
  font-size:1.08rem;color:var(--papyrus-dim);max-width:52ch;margin-bottom:30px;
}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;border-radius:10px;
  font-family:var(--sans);font-weight:700;font-size:.98rem;
  text-decoration:none;cursor:pointer;border:none;
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn-gold{
  background:linear-gradient(135deg, var(--gold-bright), var(--gold));
  color:#241004;box-shadow:0 12px 24px rgba(201,162,39,.25);
}
.btn-outline{
  background:transparent;border:1.5px solid var(--line);color:var(--gold-bright);
}
.hero-portrait{
  position:relative;
  aspect-ratio:1/1;border-radius:50%;
  border:3px solid var(--gold);
  box-shadow:var(--shadow), 0 0 0 10px rgba(201,162,39,.06);
  overflow:hidden;
  justify-self:center;
  width:min(360px, 100%);
}
.hero-portrait img{width:100%;height:100%;object-fit:cover;}
.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:38px;
  max-width:520px;
}
.stat{
  border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;
  background:rgba(201,162,39,.04);
}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--gold-bright);}
.stat span{font-size:.76rem;color:var(--papyrus-dim);}

/* ===== Section shell ===== */
section{padding:74px 0;position:relative;z-index:2;}
.section-head{max-width:640px;margin:0 auto 46px;text-align:center;}
.section-head .eyebrow{font-size:.82rem;letter-spacing:.4px;}
.section-head h2{font-size:clamp(1.7rem,3vw,2.3rem);margin-top:10px;}
.section-head p{color:var(--papyrus-dim);margin-top:12px;}
.divider{
  width:70px;height:3px;margin:18px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ===== Grade selection ===== */
.stage-group{margin-bottom:14px;}
.stage-label{
  text-align:center;font-family:var(--kufi);color:var(--gold);
  font-size:1rem;margin:34px 0 22px;
  display:flex;align-items:center;gap:14px;
}
.stage-label::before,.stage-label::after{content:"";flex:1;height:1px;background:var(--line);}
.grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.grade-card{
  background:linear-gradient(160deg, rgba(109,18,32,.35), rgba(20,10,8,.6));
  border:1px solid var(--line);
  border-radius:16px;
  padding:26px 22px;
  cursor:pointer;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  position:relative;
}
.grade-card:hover{
  transform:translateY(-6px);
  border-color:var(--gold);
  box-shadow:0 16px 32px rgba(0,0,0,.35);
}
.grade-card.active{border-color:var(--gold-bright);box-shadow:0 0 0 2px rgba(201,162,39,.3);}
.grade-icon{
  width:46px;height:46px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(201,162,39,.12);border:1px solid var(--line);
  margin-bottom:16px;color:var(--gold-bright);
}
.grade-card h3{font-size:1.15rem;margin-bottom:6px;}
.grade-card p{color:var(--papyrus-dim);font-size:.88rem;margin:0 0 14px;}
.grade-meta{display:flex;gap:8px;font-size:.72rem;color:var(--gold);flex-wrap:wrap;}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;}

/* ===== Quiz panel ===== */
.quiz-panel{
  margin-top:50px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(180deg, rgba(74,14,23,.35), rgba(15,7,6,.7));
  padding:34px;
  display:none;
}
.quiz-panel.show{display:block;animation:reveal .5s ease both;}
@keyframes reveal{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.quiz-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
.quiz-title{font-family:var(--serif);font-size:1.35rem;color:var(--gold-bright);}
.quiz-sub{font-size:.85rem;color:var(--papyrus-dim);}
.diff-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
.diff-toggle button{
  border:none;background:transparent;color:var(--papyrus-dim);
  padding:9px 20px;font-family:var(--sans);font-weight:600;cursor:pointer;font-size:.86rem;
}
.diff-toggle button.active{background:var(--gold);color:#241004;}
.count-select{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--papyrus-dim);}
.count-select select{
  background:var(--maroon-deep);color:var(--papyrus);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-family:var(--sans);
}
.start-row{display:flex;justify-content:center;margin-top:26px;}

/* progress */
.progress-wrap{margin-bottom:24px;}
.progress-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--gold-bright));width:0%;transition:width .35s ease;}
.progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--papyrus-dim);margin-top:8px;}

.question-card{display:none;}
.question-card.show{display:block;animation:reveal .35s ease both;}
.q-badge{display:inline-block;font-size:.72rem;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:14px;}
.q-text{font-size:1.22rem;color:var(--papyrus);margin-bottom:24px;font-family:var(--sans);font-weight:700;line-height:1.65;}
.options{display:grid;gap:12px;}
.option-btn{
  text-align:right;
  padding:15px 18px;border-radius:12px;
  border:1.5px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--papyrus);font-family:var(--sans);font-size:.98rem;
  cursor:pointer;transition:all .15s ease;
  display:flex;align-items:center;gap:12px;
}
.option-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(201,162,39,.06);}
.option-letter{
  width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:none;color:var(--gold);
}
.option-btn.correct{border-color:#4caf6d;background:rgba(76,175,109,.12);}
.option-btn.correct .option-letter{background:#4caf6d;border-color:#4caf6d;color:#0a1a0f;}
.option-btn.wrong{border-color:#c85454;background:rgba(200,84,84,.12);}
.option-btn.wrong .option-letter{background:#c85454;border-color:#c85454;color:#1a0a0a;}
.option-btn:disabled{cursor:default;}
.explain{
  margin-top:18px;padding:14px 16px;border-radius:10px;
  background:rgba(201,162,39,.07);border:1px solid var(--line);
  font-size:.88rem;color:var(--papyrus-dim);display:none;
}
.explain.show{display:block;}
.quiz-nav{display:flex;justify-content:space-between;margin-top:26px;}
.quiz-nav .btn{padding:11px 22px;font-size:.9rem;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--papyrus-dim);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;}

/* results */
.result-card{display:none;text-align:center;padding:20px 0;}
.result-card.show{display:block;animation:reveal .4s ease both;}
.result-score{font-family:var(--serif);font-size:3.4rem;color:var(--gold-bright);margin:10px 0 4px;}
.result-msg{font-size:1.05rem;color:var(--papyrus);margin-bottom:26px;}
.result-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}

/* ===== Random challenge banner ===== */
.challenge-banner{
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(120deg, rgba(143,26,43,.4), rgba(74,14,23,.25));
  padding:32px 34px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
}
.challenge-banner h3{font-size:1.3rem;margin-bottom:8px;}
.challenge-banner p{color:var(--papyrus-dim);margin:0;max-width:44ch;font-size:.92rem;}

/* ===== About teacher ===== */
.about-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:44px;align-items:center;}
.about-photo{
  border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);
}
.about-list{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:14px;}
.about-list li{display:flex;gap:12px;align-items:flex-start;color:var(--papyrus-dim);font-size:.95rem;}
.about-list .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none;}

/* ===== Contact / Footer ===== */
footer{border-top:1px solid var(--line);padding:50px 0 30px;}
.foot-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px;margin-bottom:30px;}
.foot-brand{display:flex;align-items:center;gap:12px;}
.foot-brand .brand-badge{width:44px;height:44px;}
.contact-btn{
  display:inline-flex;align-items:center;gap:10px;color:var(--gold-bright);
  border:1px solid var(--line);border-radius:999px;padding:10px 20px;text-decoration:none;font-size:.9rem;
}
.foot-bottom{border-top:1px solid var(--line);padding-top:20px;text-align:center;font-size:.8rem;color:var(--papyrus-dim);}

/* responsive */
@media(max-width:920px){
  .hero .wrap{grid-template-columns:1fr;text-align:center;}
  .hero-ctas{justify-content:center;}
  .hero-stats{margin-inline:auto;}
  .grade-grid{grid-template-columns:repeat(2,1fr);}
