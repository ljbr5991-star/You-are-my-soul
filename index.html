<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الشخصية مع مستر محمد 😂</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 50%, #ff6b6b 100%);
    background-size: 200% 200%;
    animation: bgmove 10s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  @keyframes bgmove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }
  .card {
    background: #fff;
    border-radius: 24px;
    max-width: 480px;
    width: 100%;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  h1 {
    font-size: 1.5em;
    color: #333;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #888;
    font-size: 0.9em;
    margin-bottom: 20px;
  }
  .progress {
    height: 8px;
    background: #eee;
    border-radius: 10px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg,#ff6b6b,#6a11cb);
    width: 0%;
    transition: width .4s ease;
  }
  .question {
    font-size: 1.15em;
    color: #222;
    margin-bottom: 22px;
    font-weight: bold;
    min-height: 60px;
  }
  .options button {
    display: block;
    width: 100%;
    background: #f4f4fb;
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 1em;
    cursor: pointer;
    text-align: right;
    transition: all .2s;
    color: #333;
  }
  .options button:hover {
    border-color: #6a11cb;
    background: #ece6ff;
    transform: scale(1.02);
  }
  .gender-options {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-top: 10px;
  }
  .gender-options button {
    flex: 1;
    padding: 22px 10px;
    font-size: 1.3em;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    background: #f4f4fb;
    transition: all .2s;
  }
  .gender-options button:hover {
    transform: scale(1.05);
    background: #ece6ff;
  }
  .result-emoji {
    font-size: 4em;
    margin-bottom: 6px;
  }
  .result-title {
    font-size: 1.4em;
    font-weight: bold;
    color: #6a11cb;
    margin-bottom: 12px;
  }
  .result-text {
    font-size: 1.05em;
    color: #444;
    line-height: 1.7;
    margin-bottom: 20px;
  }
  .mr-mohamed {
    background: #fff3f3;
    border: 2px dashed #ff6b6b;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    font-weight: bold;
    color: #c0392b;
    font-size: 1.1em;
  }
  .restart {
    background: linear-gradient(90deg,#6a11cb,#2575fc);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    font-size: 1em;
    cursor: pointer;
  }
  .restart:hover { opacity: .9; }
  .start-emoji { font-size: 3.5em; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card" id="card">
  <!-- المحتوى بيتغير بالجافاسكريبت -->
</div>
<script>
const questionBank = [
  {
    q: "أول حاجة... انت مستني حد اتأخر عليك ساعة، تعمل ايه؟",
    options: [
      { text: "أتصل عليه 50 مرة وأزعّق", trait: "عصبي" },
      { text: "أفتح الموبايل وأسليّ نفسي وأستنى بهدوء", trait: "هادئ" },
      { text: "أمشي وأسيبه، ما ليش نفس", trait: "مزاجي" },
      { text: "أطلب أكل وأستناه وأنا واكل 😂", trait: "استمتاعي" }
    ]
  },
  {
    q: "لو لقيت 100 جنيه في الشارع، تعمل ايه؟",
    options: [
      { text: "أدورلها على صاحبها", trait: "طيب" },
      { text: "أصرفها على أكل فورًا", trait: "استمتاعي" },
      { text: "أوفرها وما أقولش لحد", trait: "هادئ" },
      { text: "أشتري بيها هدية لحد بحبه", trait: "طيب" }
    ]
  },
  {
    q: "صحابك عملوا خروجة وما كلموكش، رد فعلك؟",
    options: [
      { text: "أزعل بجد وأقولهم كلمتين", trait: "عصبي" },
      { text: "أعمل نفسي مش شايف حاجة", trait: "مزاجي" },
      { text: "أكلمهم بهدوء واسأل ليه", trait: "هادئ" },
      { text: "أعمل خروجة أحلى من غيرهم وأنساها", trait: "استمتاعي" }
    ]
  },
  {
    q: "امتحان بكرة وانت لسه فاتح الكتاب النهاردة، تعمل ايه؟",
    options: [
      { text: "أذاكر بسرعة الصاروخ وأدخل بالحظ", trait: "استمتاعي" },
      { text: "أخد نفس عميق واذاكر بالخطة والتقسيم", trait: "هادئ" },
      { text: "أعصب على نفسي وأقول ليه مذاكرتش بدري", trait: "عصبي" },
      { text: "أقرر أذاكر شوية وأنام الباقي، يبقى اللي يبقى", trait: "مزاجي" }
    ]
  },
  {
    q: "حد زعّلك أوي، بتعمل ايه بعد كده؟",
    options: [
      { text: "بفضل زعلان أيام وما بكلمهوش", trait: "مزاجي" },
      { text: "بواجهه فورًا وأقوله اللي جوايا", trait: "عصبي" },
      { text: "بستوعب الموضوع وأدي فرصة تانية", trait: "طيب" },
      { text: "بنسى بسرعة وبكمل حياتي عادي", trait: "هادئ" }
    ]
  },
  {
    q: "الأكل جالك غلط في المطعم، تعمل ايه؟",
    options: [
      { text: "أزعّق للجرسون فورًا", trait: "عصبي" },
      { text: "أطلب يغيروه بهدوء وأشرح المشكلة", trait: "هادئ" },
      { text: "أكله زي ما هو، معلش", trait: "طيب" },
      { text: "أعمل منها موضوع وأتصور وأنزله ستوري 😂", trait: "استمتاعي" }
    ]
  },
  {
    q: "لو عندك فلوس هتوفرها، تعمل بيها ايه؟",
    options: [
      { text: "أسافر رحلة وأستمتع بيها فورًا", trait: "استمتاعي" },
      { text: "أحطها في حساب توفير وأنساها", trait: "هادئ" },
      { text: "أشتري بيها حاجة لأهلي أو أصحابي", trait: "طيب" },
      { text: "تفضل معايا وبعدين أصرفها فجأة بجنون", trait: "مزاجي" }
    ]
  },
  {
    q: "حد بيتكلم في حد وانت مش موافق، تعمل ايه؟",
    options: [
      { text: "أقاطعه فورًا وأدافع", trait: "عصبي" },
      { text: "أسيبه يتكلم وأقول رأيي بهدوء بعدين", trait: "هادئ" },
      { text: "أدافع عن الشخص لو مش موجود", trait: "طيب" },
      { text: "أغيّر الموضوع لحاجة تضحك", trait: "استمتاعي" }
    ]
  },
  {
    q: "يوم إجازتك، بتعمل ايه غالبًا؟",
    options: [
      { text: "أخرج وأعمل حاجة جديدة وممتعة", trait: "استمتاعي" },
      { text: "أقعد لوحدي وأرتاح تمامًا", trait: "هادئ" },
      { text: "أساعد حد في حاجة يحتاجها", trait: "طيب" },
      { text: "بيعتمد على مزاجي وقت ما أصحى", trait: "مزاجي" }
    ]
  },
  {
    q: "لو حد داس عليك في الشارع من غير قصد، رد فعلك؟",
    options: [
      { text: "أقوله معلش بس بنبرة متضايقة", trait: "عصبي" },
      { text: "أبتسم وأقول معلش عادي", trait: "طيب" },
      { text: "أكمل مشيي وكأن حاجة ما حصلتش", trait: "هادئ" },
      { text: "أعمل منها موقف كوميدي وأضحك", trait: "استمتاعي" }
    ]
  },
  {
    q: "بتحب تقضي وقتك مع مين أكتر؟",
    options: [
      { text: "مجموعة كبيرة وصوت عالي وضحك", trait: "استمتاعي" },
      { text: "صاحب واحد مقرب وكلام هادي", trait: "هادئ" },
      { text: "العيلة، بحس بالأمان معاهم", trait: "طيب" },
      { text: "بيتغير حسب مزاجي في اليوم ده", trait: "مزاجي" }
    ]
  },
  {
    q: "حد طلب منك مساعدة في وقت ضيق، تعمل ايه؟",
    options: [
      { text: "أساعده فورًا حتى لو تعبان", trait: "طيب" },
      { text: "أشرحله إني مش فاضي بس بأسلوب هادي", trait: "هادئ" },
      { text: "أنرفز لإنه مختار توقيت وحش", trait: "عصبي" },
      { text: "أساعده وأخليها فرصة نضحك مع بعض", trait: "استمتاعي" }
    ]
  },
  {
    q: "اتعملت لك مقلب، رد فعلك ايه؟",
    options: [
      { text: "أضحك معاهم وأرد المقلب أحسن", trait: "استمتاعي" },
      { text: "أعصب شوية بس أسترجع بسرعة", trait: "عصبي" },
      { text: "أزعل وأفضل ساكت فترة", trait: "مزاجي" },
      { text: "آخدها بأريحية وأقولهم تسلموا", trait: "هادئ" }
    ]
  },
  {
    q: "بتاخد قرارات مهمة إزاي عادة؟",
    options: [
      { text: "بسرعة وبمشاعري في اللحظة", trait: "مزاجي" },
      { text: "بعد تفكير طويل ومنطقي", trait: "هادئ" },
      { text: "بسأل الناس اللي بحبهم قبل ما أقرر", trait: "طيب" },
      { text: "بختار اللي هيكون فيه متعة أكتر", trait: "استمتاعي" }
    ]
  },
  {
    q: "لو الجو وحش وانت طالع من البيت، تعمل ايه؟",
    options: [
      { text: "أتنرفز وأقول إحساس اليوم اتقلب", trait: "عصبي" },
      { text: "آخد شمسية وأكمل يومي عادي", trait: "هادئ" },
      { text: "أرجع البيت وأعمل حاجة تانية بمزاجي", trait: "مزاجي" },
      { text: "أستمتع بالجو وأتصور صور حلوة", trait: "استمتاعي" }
    ]
  },
  {
    q: "حد من عيلتك محتاج وقتك النهاردة، بس عندك خطة، تعمل ايه؟",
    options: [
      { text: "ألغي خطتي على طول علشانه", trait: "طيب" },
      { text: "أوازن بين الاتنين بهدوء", trait: "هادئ" },
      { text: "أتنرفز لأن خطتي اتبوظت", trait: "عصبي" },
      { text: "أحول الموقف لحاجة نضحك فيها مع بعض", trait: "استمتاعي" }
    ]
  }
];
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const QUESTIONS_PER_ROUND = 8;
let questions = [];
let currentQ = 0;
let scores = {};
let gender = null;
const card = document.getElementById('card');
function renderStart() {
  card.innerHTML = `
    <div class="start-emoji">🧠✨</div>
    <h1>اختبار الشخصية مع مستر محمد</h1>
    <p class="subtitle">جاوب على المواقف دي وشوف مستر محمد هيقولك ايه في الآخر 😏</p>
    <button class="restart" onclick="startQuiz()">ابدأ الاختبار</button>
  `;
}
function startQuiz() {
  const pool = shuffle(questionBank).slice(0, QUESTIONS_PER_ROUND);
  questions = pool.map(q => ({ q: q.q, options: shuffle(q.options) }));
  currentQ = 0;
  scores = {};
  gender = null;
  renderQuestion();
}
function renderQuestion() {
  const q = questions[currentQ];
  const progressPct = (currentQ / (questions.length + 1)) * 100;
  card.innerHTML = `
    <div class="progress"><div class="progress-bar" style="width:${progressPct}%"></div></div>
    <div class="question">${q.q}</div>
    <div class="options">
      ${q.options.map((opt, i) => `<button onclick="answer(${i})">${opt.text}</button>`).join('')}
    </div>
  `;
}
function answer(i) {
  const trait = questions[currentQ].options[i].trait;
  scores[trait] = (scores[trait] || 0) + 1;
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    renderGenderQuestion();
  }
}
function renderGenderQuestion() {
  const progressPct = (questions.length / (questions.length + 1)) * 100;
  card.innerHTML = `
    <div class="progress"><div class="progress-bar" style="width:${progressPct}%"></div></div>
    <div class="question">آخر سؤال... انت ولد ولا بنت؟</div>
    <div class="gender-options">
      <button onclick="setGender('ولد')">🙋‍♂️ ولد</button>
      <button onclick="setGender('بنت')">🙋‍♀️ بنت</button>
    </div>
  `;
}
function setGender(g) {
  gender = g;
  renderResult();
}
function getTopTrait() {
  let top = null, max = -1;
  for (const t in scores) {
    if (scores[t] > max) { max = scores[t]; top = t; }
  }
  return top;
}
const traitInfo = {
  "عصبي": {
    emoji: "🔥",
    title: "شخصية نارية",
    text: "انت شخص عنيف الانفعال شوية، بتاخد الأمور بجدية زيادة وبتتعصب بسرعة. بس الحلو إنك واضح ومباشر، محدش بيتلخبط معاك."
  },
  "هادئ": {
    emoji: "🧘",
    title: "شخصية هادئة",
    text: "انت شخص متزن وبتفكر قبل ما ترد فعل. بتاخد الأمور بعقلانية وده بيخليك مصدر راحة للي حواليك."
  },
  "مزاجي": {
    emoji: "🎭",
    title: "شخصية مزاجية",
    text: "مزاجك بيتغير بسرعة وبتتأثر بأي حاجة بتحصلك. اللي حواليك لازم يعرفوا يمسكوا التايمنج الصح معاك."
  },
  "طيب": {
    emoji: "💛",
    title: "شخصية طيبة",
    text: "قلبك أبيض وبتفكر في اللي حواليك قبل نفسك. الناس بتحبك بسبب طيبتك، بس خد بالك متتستغلش."
  },
  "استمتاعي": {
    emoji: "🎉",
    title: "شخصية استمتاعية",
    text: "شعارك في الحياة استمتع دلوقتي وفكر بعدين. بتحول أي موقف لفرصة ضحك واستمتاع، وده بيخفف عن اللي حواليك."
  }
};
function renderResult() {
  const top = getTopTrait();
  const info = traitInfo[top];
  const isBoy = gender === 'ولد';
  const mrText = isBoy
    ? "مستر محمد بيقولك: يا ابني انت اهبل 😂🤝"
    : "مستر محمد بيقولك: يا بنتي انتي هبلة 😂🤝";
  card.innerHTML = `
    <div class="result-emoji">${info.emoji}</div>
    <div class="result-title">${info.title}</div>
    <div class="result-text">${info.text}</div>
    <div class="mr-mohamed">${mrText}<br><span style="font-size:0.85em; font-weight:normal;">(الاختبار ده للفشخرة بس، متزعلش 😅)</span></div>
    <button class="restart" onclick="renderStart()">جرب تاني</button>
  `;
}
renderStart();
</script>
</body>
</html>
